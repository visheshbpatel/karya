<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · Karya</title>
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div class="auth">
  <aside class="auth-aside">
    <a class="brand" href="login.html" aria-label="Karya"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".18" stroke-width="2"/><path d="M12 3a9 9 0 1 1-8.2 5.3" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/><path d="M8.5 12.3l2.5 2.5 4.5-5" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Karya</a>
    <svg class="art" viewBox="0 0 420 420" fill="none" aria-hidden="true"><circle cx="210" cy="210" r="170" stroke="var(--line-strong)" stroke-width="1.5"/><path d="M210 40a170 170 0 1 1-147 85" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><circle cx="63" cy="125" r="6" fill="var(--accent)"/></svg>
    <p class="cap">One thing, then the next.<small>कार्य · work, a deed done</small></p>
  </aside>
  <main class="auth-main">
    <div class="theme-slot" data-theme-slot></div>
    <div class="auth-card">
      <div class="auth-head">
        <a class="brand m-brand" href="login.html">Karya</a>
        <h1 class="t-display">Start with Karya</h1>
        <p class="muted">Create an account, then confirm your email with a six-digit code.</p>
      </div>
      <div id="banner"></div>
      <form id="form" novalidate>
        <div class="grid-2">
          <div class="field"><label class="label" for="first_name">First name</label><input id="first_name" class="input" type="text" autocomplete="given-name" maxlength="100" autofocus></div>
          <div class="field"><label class="label" for="last_name">Last name</label><input id="last_name" class="input" type="text" autocomplete="family-name" maxlength="100"></div>
        </div>
        <div class="field">
          <label class="label" for="username">Username</label>
          <input id="username" class="input" type="text" autocomplete="username" maxlength="50" aria-describedby="username-h">
          <p class="hint" id="username-h">3 to 50 characters. You can sign in with it.</p>
        </div>
        <div class="field"><label class="label" for="email">Email</label><input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com" maxlength="255"></div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <div class="input-wrap">
            <input id="password" class="input" type="password" autocomplete="new-password" maxlength="128" aria-describedby="password-h">
            <button type="button" id="toggle" class="btn btn-ghost btn-icon input-end" aria-label="Show password"></button>
          </div>
          <p class="hint" id="password-h">At least 8 characters.</p>
        </div>
        <button type="submit" id="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 8px">Create account</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>
</div>
<script type="module" src="js/register.js"></script>
</body>
</html>
