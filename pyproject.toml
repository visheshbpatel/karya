[project]
name = "karya"
version = "0.1.0"
description = "Karya is a task management application designed to make managing everyday work simple and flexible."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
